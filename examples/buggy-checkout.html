<!doctype html><meta charset="utf-8"><title>Shop — Checkout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;
  color:#1b1f26;width:900px;height:640px}
.top{background:#fff;border-bottom:1px solid #e3e6ea;padding:14px 28px;
  display:flex;align-items:center;gap:26px}
.brand{font-weight:700;font-size:17px;color:#2b6cb0}
.nav{display:flex;gap:20px;color:#5a6474;font-size:14px}
.main{padding:28px}
h1{font-size:22px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:20px;
  margin-bottom:16px}
.row{display:flex;justify-content:space-between;padding:7px 0;color:#49505e}
.row.tot{border-top:1px solid #e3e6ea;margin-top:9px;padding-top:12px;
  font-weight:700;color:#1b1f26;font-size:17px}
.err{background:#fdecea;border:1px solid #f5c2c0;border-left:4px solid #d93025;
  border-radius:6px;padding:14px 16px;margin-bottom:16px}
.err .t{color:#b3261e;font-weight:600;font-size:15px}
.err .d{color:#7a2e29;font-size:13px;margin-top:3px}
.btns{display:flex;gap:10px}
button{font:600 14px inherit;padding:11px 20px;border-radius:6px;cursor:pointer}
.pri{background:#2b6cb0;color:#fff;border:0}
.sec{background:#fff;color:#49505e;border:1px solid #cdd3db}
</style>
<div class="top">
  <span class="brand">Northwind</span>
  <div class="nav"><span>Products</span><span>Orders</span><span>Account</span></div>
</div>
<div class="main">
  <h1>Checkout</h1>
  <div class="err">
    <div class="t">Coudn't complete yor order</div>
    <div class="d">Your card was not charged. Please try again.</div>
  </div>
  <div class="card">
    <div class="row"><span>Subtotal</span><span>$84.00</span></div>
    <div class="row"><span>Shipping</span><span>$6.50</span></div>
    <div class="row tot"><span>Order total</span><span>$90.50</span></div>
  </div>
  <div class="btns">
    <button class="pri">Retry payment</button>
    <button class="sec">Cancel order</button>
  </div>
</div>
